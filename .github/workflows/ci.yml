# QA Gate (baseline) — runs on every PR into a protected branch.
# This is the required status check that enforces "QA Gate 1" on dev, and is
# also part of the gates on stg and prd. No secrets: it must pass for
# anyone, on any branch, with no environment access.
name: ci

on:
  pull_request:
    branches: [dev, stg, prd, "release/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
