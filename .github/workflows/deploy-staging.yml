# Push-to-stg pipeline. Two jobs:
#
#   1. backend — applies Supabase migrations to the staging project. (Frontend
#      rides Vercel's Git integration independently.) With the 2-project
#      free-tier setup the `stg` Doppler config points NEXT_SUPABASE_PROJECT_REF
#      at the dev Supabase project; give staging its own DB later by changing
#      that one Doppler var — nothing here moves.
#
#   2. post-deploy-validation — "deployment tests" against the live staging URL
#      once it's serving the new code: full Playwright e2e + a Lighthouse audit.
#      This is the right place for environment-targeted validation (pre-merge
#      gates can't do it — the code isn't deployed yet). NEXT_PUBLIC_SITE_URL is
#      a hard requirement; the job fails if it's unset.
name: deploy-staging

on:
  push:
    branches: [stg]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Push migrations
        run: |
          doppler run -- bash -euo pipefail -c '
            export SUPABASE_ACCESS_TOKEN="$NEXT_SUPABASE_PAT"
            supabase link --project-ref "$NEXT_SUPABASE_PROJECT_REF" --password "$NEXT_SUPABASE_DB_PASSWORD"
            supabase db push --password "$NEXT_SUPABASE_DB_PASSWORD"
          '

  post-deploy-validation:
    name: Post-Deploy Validation (Staging)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
      # stg is a Vercel preview deployment with Deployment Protection on, so it
      # returns 401 without this bypass header. Get the value from Vercel:
      # Project → Settings → Deployment Protection → Protection Bypass for
      # Automation. Harmless on unprotected URLs (Vercel ignores empty values).
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - run: npx playwright install --with-deps chromium

      - name: Resolve deployed base URL
        # NEXT_PUBLIC_SITE_URL lives in the stg Doppler config. Hard requirement:
        # fail loudly if it's unset rather than silently skipping validation.
        # Strip any trailing slash so downstream "$BASE_URL/" can't become "//"
        # (Vercel 308-redirects "//", which would fail the 200 poll).
        run: |
          BASE_URL="$(doppler secrets get NEXT_PUBLIC_SITE_URL --plain)"
          if [ -z "$BASE_URL" ] || [ "$BASE_URL" = "null" ]; then
            echo "ERROR: NEXT_PUBLIC_SITE_URL is not set in the stg Doppler config."
            echo "Post-deploy validation runs against the deployed URL; set it to continue."
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Wait for deployment to settle
        # Supabase backend deploy is fast; Vercel may still be building. Poll the
        # URL until it serves 200 so the e2e suite hits the new code. 10-minute
        # budget covers a typical Vercel build. The bypass header gets us past
        # Deployment Protection on the preview URL.
        run: |
          set -euo pipefail
          echo "Polling $BASE_URL for readiness..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "$BASE_URL/")
            if [ "$STATUS" = "200" ]; then
              echo "Staging responding 200 after ${i} attempts"
              exit 0
            fi
            echo "Attempt ${i}: got ${STATUS}, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: staging never returned 200 within 10 minutes"
          exit 1

      - name: Run e2e against deployed staging
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4 # TODO: pin to SHA once the pipeline is stable
        with:
          name: playwright-staging-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Lighthouse audit
        # The action bundles its own Chrome (a bare `npx @lhci/cli` would need
        # system Chrome the runner doesn't have). Assertions come from
        # lighthouserc.cjs (warn-level to start).
        uses: treosh/lighthouse-ci-action@v12 # TODO: pin to SHA once the pipeline is stable
        with:
          urls: "${{ env.BASE_URL }}/"
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
