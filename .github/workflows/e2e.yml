# Added rigor for "QA Gate 2" (release/* -> stg) and "QA Gate 3"
# (release/* -> prd): Playwright end-to-end run. Pulls a non-production env
# (stg config) from Doppler so the app can boot against a real Supabase project.
#
# Lighthouse is intentionally NOT wired yet — see docs/pipeline.md "TODO".
name: e2e

on:
  pull_request:
    branches: [stg, prd, "release/**"]

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dopplerhq/cli-action@v3
      - run: npx playwright install --with-deps chromium
      # Playwright boots the app itself (see playwright.config.ts webServer).
      # The outer `doppler run` injects env that the spawned dev server inherits.
      - name: Run Playwright
        run: doppler run -- npm run test:e2e
